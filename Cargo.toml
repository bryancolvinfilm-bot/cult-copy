[package]
name = "cult-copy"
version = "0.1.8"
edition = "2021"
rust-version = "1.90"
description = "A private, peer-to-peer clipboard for your computers"
license = "MIT"
# Canonical executable name used by launchers and installers.
default-run = "cult-copy"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:tray-icon", "dep:notify-rust", "dep:raw-window-handle", "dep:windows-sys"]
ui-test = ["desktop"]

[dependencies]
anyhow = "1"
bincode = "1.3"
blake3 = "1"
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
directories = "6"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
fs2 = "0.4"
hex = "0.4"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
mdns-sd = "0.21"
notify-rust = { version = "4.18.2", optional = true }
raw-window-handle = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
snow = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFPreferences", "CFString"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString"] }
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSPasteboardItem"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"], optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "cult-copy"
path = "src/main.rs"
required-features = ["desktop"]
