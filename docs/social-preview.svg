  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="356" y="194" font-size="52" font-weight="bold" fill="#fff">Cult Copy</text>
    <text x="360" y="258" font-size="28" fill="#fff">One clipboard across your computers.</text>
    <text x="360" y="308" font-size="28" fill="#97a3b8">Text, images &amp; files. Paired. Local. Private.</text>
    <text x="80" y="475" font-size="22" fill="#6de0c1">WINDOWS  /  macOS  /  LINUX</text>
    <text x="80" y="539" font-size="22" fill="#97a3b8">Private, peer-to-peer clipboard sharing. Open source.</text>
  </g>
