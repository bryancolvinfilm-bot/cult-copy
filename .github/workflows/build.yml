name: Test, build, and publish
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && 'Publish' || 'Check' }} ${{ github.sha }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA on main to build (must match the selected main ref)
        required: true
        type: string
      publish_release:
        description: Publish verified installers on GitHub Releases
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.version.outputs.matrix }}
      rpm_matrix: ${{ steps.version.outputs.rpm_matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Release verifier checks
        shell: pwsh
        run: ./scripts/test-release-assets.ps1
      - name: Validate source and read package version
        id: version
        shell: pwsh
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF -ne 'refs/heads/main' -or $env:REQUESTED_SHA -ne $env:GITHUB_SHA) {
              throw 'Dispatch must select main and exactly match expected_sha. Fetch and retry against the current commit.'
            }
          }
          . ./scripts/version.ps1
          "version=$(Get-AppVersion)" >> $env:GITHUB_OUTPUT
          $targets = @(Get-Content packaging/release-targets.json -Raw | ConvertFrom-Json)
          "matrix=$(@{include=@($targets | Where-Object { $_.build_kind -ne 'rpm' })} | ConvertTo-Json -Depth 8 -Compress)" >> $env:GITHUB_OUTPUT
          "rpm_matrix=$(@{include=@($targets | Where-Object { $_.build_kind -eq 'rpm' })} | ConvertTo-Json -Depth 8 -Compress)" >> $env:GITHUB_OUTPUT
      - name: Verify release can be created
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$APP_VERSION" --json isDraft --jq '.isDraft' > existing-release.txt 2>/dev/null; then
            test "$(cat existing-release.txt)" = true || { echo 'This version is already public. Bump Cargo.toml and Cargo.lock.'; exit 1; }
          fi

  desktop:
    name: Build ${{ matrix.id }}
    needs: metadata
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      APP_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.rust_target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ matrix.id }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config xvfb weston desktop-file-utils libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libxkbcommon-dev libxkbcommon-x11-0
      - name: Verify native architecture
        shell: bash
        env:
          EXPECTED_HOST: ${{ matrix.rust_target }}
        run: |
          task_host=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          test "$task_host" = "$EXPECTED_HOST" || { echo "Unexpected compiler architecture: $task_host" >&2; exit 1; }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Native Windows or macOS clipboard
        if: runner.os != 'Linux'
        run: cargo test --locked --test native_clipboard -- --ignored --test-threads=1
      - name: Native Linux X11 clipboard
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked --test native_clipboard -- --ignored --test-threads=1
      - name: Linux tray and window lifecycle
        if: runner.os == 'Linux'
        run: |
          sh scripts/test-linux-lifecycle.sh x11
          sh scripts/test-linux-lifecycle.sh wayland
      - name: Build Windows
        if: runner.os == 'Windows'
        run: cargo build --release --locked
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') -and !(Test-Path 'C:\Program Files\Inno Setup 7\ISCC.exe')) { choco install innosetup --yes --no-progress }
          ./scripts/package-windows.ps1 -Architecture '${{ matrix.arch }}'
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path target/release/duet-clipboard.exe))
          if (!$icon) { throw 'Windows executable has no icon.' }
          $icon.Dispose()
      - name: Windows upgrade from the original app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-upgrade.ps1 -Architecture '${{ matrix.arch }}'
      - name: macOS or Linux installer
        if: runner.os != 'Windows'
        run: sh scripts/package-unix.sh
      - name: Linux installer smoke test
        if: runner.os == 'Linux'
        run: |
          task_install_dir=$(mktemp -d "$RUNNER_TEMP/cult-copy-install.XXXXXXXX")
          mkdir -p "$task_install_dir/share/applications" "$task_install_dir/share/duet-clipboard"
          printf '[Desktop Entry]\nName=Duet Clipboard\n' > "$task_install_dir/share/applications/duet-clipboard.desktop"
          printf 'legacy executable\n' > "$task_install_dir/share/duet-clipboard/duet-clipboard"
          XDG_DATA_HOME="$task_install_dir/share" sh "dist/CultCopy-$APP_VERSION-linux-${{ matrix.arch }}.run"
          "$task_install_dir/share/duet-clipboard/duet-clipboard" --version
          test "$(grep '^Name=' "$task_install_dir/share/applications/duet-clipboard.desktop")" = 'Name=Cult Copy'
          test ! -e "$task_install_dir/share/applications/cult-copy.desktop"
          desktop-file-validate "$task_install_dir/share/applications/duet-clipboard.desktop"
          test "$(sed -n 's/^Icon=//p' "$task_install_dir/share/applications/duet-clipboard.desktop")" = duet-clipboard
          test "$(sed -n 's/^StartupWMClass=//p' "$task_install_dir/share/applications/duet-clipboard.desktop")" = duet-clipboard
          cmp packaging/icons/icon-256.png "$task_install_dir/share/icons/hicolor/256x256/apps/duet-clipboard.png"
          cmp packaging/cult-copy.svg "$task_install_dir/share/icons/hicolor/scalable/apps/duet-clipboard.svg"
          chmod +x "dist/CultCopy-$APP_VERSION-linux-${{ matrix.arch }}.AppImage"
          "dist/CultCopy-$APP_VERSION-linux-${{ matrix.arch }}.AppImage" --appimage-extract-and-run --version
          desktop-file-validate dist/*.AppDir/duet-clipboard.desktop
      - name: Verify packaged Mac icon
        if: runner.os == 'macOS'
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' 'dist/macos-root/Cult Copy.app/Contents/Info.plist')" = cult-copy.icns
          iconutil -c iconset 'dist/macos-root/Cult Copy.app/Contents/Resources/cult-copy.icns' -o "$RUNNER_TEMP/cult-copy.iconset"
          test -f "$RUNNER_TEMP/cult-copy.iconset/icon_512x512@2x.png"
      - name: Mac upgrade from the original app
        if: runner.os == 'macOS'
        run: sh scripts/test-macos-upgrade.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CultCopy-${{ matrix.id }}-${{ github.sha }}
          path: |
            dist/*setup.exe
            dist/*.pkg
            dist/*.dmg
            dist/*.AppImage
            dist/*.run
          if-no-files-found: error
          retention-days: 14

  rpm:
    name: Build ${{ matrix.id }}
    needs: metadata
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.rpm_matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      # Checkout's Node runtime needs libstdc++/glibc; install Git and the build
      # libraries in the target distro before executing any JavaScript actions.
      - name: Bootstrap distro tools
        run: dnf -y install git tar gzip curl ca-certificates libstdc++
      - uses: actions/checkout@v4
      - name: Distro build dependencies
        run: sh scripts/linux-distro-deps.sh '${{ matrix.distro }}'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.rust_target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ matrix.id }}
      - name: Verify native architecture
        env:
          EXPECTED_HOST: ${{ matrix.rust_target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_HOST"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Native distro X11 clipboard
        run: dbus-run-session -- xvfb-run -a cargo test --locked --test native_clipboard -- --ignored --test-threads=1
      - name: Build RPM in target distro
        run: sh scripts/package-rpm.sh '${{ matrix.distro }}'
      - name: Install and uninstall RPM
        run: sh scripts/test-linux-rpm.sh '${{ matrix.distro }}'
      - uses: actions/upload-artifact@v4
        with:
          name: CultCopy-${{ matrix.id }}-${{ github.sha }}
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [metadata, desktop, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      APP_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: CultCopy-*-${{ github.sha }}
          merge-multiple: true
          path: release-assets
      - name: Prepare and validate all platform assets
        shell: pwsh
        run: |
          ./scripts/release-assets.ps1 -Mode Prepare -Directory release-assets -Version $env:APP_VERSION -SourceSha $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY -RunUrl "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
      - name: Publish verified public downloads
        shell: bash
        run: bash scripts/publish-release.sh
