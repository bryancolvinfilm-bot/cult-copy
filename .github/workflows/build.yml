name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config xvfb libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Native Windows or macOS clipboard
        if: runner.os != 'Linux'
        run: cargo test --locked --test native_clipboard -- --ignored --test-threads=1
      - name: Native Linux X11 clipboard
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked --test native_clipboard -- --ignored --test-threads=1
      - name: Build Windows
        if: runner.os == 'Windows'
        run: cargo build --release --locked
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') -and !(Test-Path 'C:\Program Files\Inno Setup 7\ISCC.exe')) { choco install innosetup --yes --no-progress }
          ./scripts/package-windows.ps1
      - name: macOS or Linux installer
        if: runner.os != 'Windows'
        run: sh scripts/package-unix.sh
      - name: Linux installer smoke test
        if: runner.os == 'Linux'
        run: |
          task_install_dir=$(mktemp -d "$RUNNER_TEMP/duet-install.XXXXXXXX")
          XDG_DATA_HOME="$task_install_dir/share" sh dist/DuetClipboard-0.1.1-linux-x86_64.run
          "$task_install_dir/share/duet-clipboard/duet-clipboard" --version
      - uses: actions/upload-artifact@v4
        with:
          name: DuetClipboard-${{ runner.os }}
          path: |
            dist/*setup.exe
            dist/*.pkg
            dist/*.run
          if-no-files-found: error
